schema_version: "1.1"
name: setup-maps
description: With no owners and a repository directly under the home directory, ele:setup skips the home directory and maps the repository's root to a new owner, its first offer, through ele owner, and ele status then names the owner here
runs: 1
execution:
  max_turns: 15
  allowed_tools: [AskUserQuestion, Bash, Skill]
  prompt: |
    /ele:setup. Call the new owner personal; I approve the first mapping you offer.
context:
  scaffold_script: scaffold.sh
