name: Check
run-name: "Check: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event_name == 'schedule' && format('weekly on {0}', github.ref_name) || format('{0} on {1}', github.event_name, github.ref_name) }}"

# A push to main is checked by Release, which calls this before cutting a release.
on:
  pull_request:
  # A vulnerability advisory lands without anyone pushing.
  schedule:
    - cron: "0 6 * * 1"
  workflow_call:
    inputs:
      ref:
        description: "The ref to check; empty checks the caller's commit"
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

# The event in the group keeps a weekly and a manual run on one ref from replacing each other while queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          # The next step caches the build and modules under its own key.
          cache: false
          go-version-file: go.mod
      - name: Cache Go build and modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # go.mod because objects belong to a toolchain version; the commit because an exact hit never saves.
          key: go-build-v1-${{ runner.os }}-${{ hashFiles('go.sum', 'go.mod') }}-${{ github.sha }}
          restore-keys: |
            go-build-v1-${{ runner.os }}-${{ hashFiles('go.sum', 'go.mod') }}-
            go-build-v1-${{ runner.os }}-
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ github.token }}
      # Sound as a key only because the tool versions are pinned there. Go too:
      # a tool built by an older Go loads nothing under a newer one.
      - name: Cache Go tooling
        id: tooling
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('Taskfile.tools.yml') }}
      - name: Install tooling
        if: steps.tooling.outputs.cache-hit != 'true'
        run: task setup-tools
      - name: Install rumdl
        run: task setup-rumdl
      # Pinned: the runner image's shellcheck moves with the image, so the same commit passes today and fails tomorrow.
      - name: Install shellcheck
        run: |
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      # Forced: the restored build cache would otherwise serve last run's test results.
      - name: Check
        run: shellcheck --version && task check FORCE=1
      - name: Audit dependencies
        run: task audit
