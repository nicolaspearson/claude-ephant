schema_version: "1.1"
name: remember-auto-on
description: With auto_note_writes on, ele:remember writes a proposed note without asking
runs: 1
execution:
  max_turns: 10
  allowed_tools: [AskUserQuestion, Bash, Skill]
  prompt: |
    We just decided to pin pydantic below 2.14, because 2.14 reorders validators and breaks our request models. Propose notes for this per /ele:remember.
context:
  scaffold_script: scaffold.sh
