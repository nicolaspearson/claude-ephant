schema_version: "1.1"
name: recipe-audit
description: ele:recipe audit reports a skill's missing command, removed flag and stale version pin, leaves a valid flag alone, and edits nothing unapproved
runs: 1
execution:
  max_turns: 25
  allowed_tools: [AskUserQuestion, Bash, Edit, Read, Skill, Write]
  prompt: |
    Audit my skill for stale commands with /ele:recipe audit skills/rotate-dev-cert/SKILL.md.
context:
  scaffold_script: scaffold.sh
