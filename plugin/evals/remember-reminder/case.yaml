schema_version: "1.1"
name: remember-reminder
description: ele:remember saves a reminder for a spoken date as a reminder note due that date
runs: 1
execution:
  max_turns: 10
  allowed_tools: [AskUserQuestion, Bash, Skill]
  prompt: |
    Remind me on 1 December 2026 to revisit running plan items in parallel worktrees. Use /ele:remember.
context:
  scaffold_script: scaffold.sh
