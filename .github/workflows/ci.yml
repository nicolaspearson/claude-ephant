name: Check
run-name: "Check: ${{ github.event_name == 'push' && github.event.head_commit.message || github.event_name == 'pull_request' && github.event.pull_request.title || github.event_name == 'schedule' && format('weekly on {0}', github.ref_name) || format('{0} on {1}', github.event_name, github.ref_name) }}"

on:
  pull_request:
  push:
    branches: [main]
  # A vulnerability advisory lands without anyone pushing.
  schedule:
    - cron: "0 6 * * 1"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The event in the group keeps a push from cancelling the weekly or a manual run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        id: go
        with:
          go-version-file: go.mod
          # Its restore answers 400 against the current cache service and the
          # save is then skipped, so it caches nothing while reading as a miss.
          cache: false
      - name: Cache Go build and modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # go.mod because objects belong to a toolchain version.
          key: go-build-v1-${{ runner.os }}-${{ hashFiles('go.sum', 'go.mod') }}
          restore-keys: go-build-v1-${{ runner.os }}-
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      # Sound as a key only because the tool versions are pinned there. Go too:
      # a tool built by an older Go loads nothing under a newer one.
      - name: Cache Go tooling
        id: tooling
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('Taskfile.tools.yml') }}
      - name: Install tooling
        if: steps.tooling.outputs.cache-hit != 'true'
        run: task setup-tools
      # Forced: the restored build cache would otherwise serve last run's test results.
      - name: Check
        run: task check FORCE=1
      - name: Audit dependencies
        run: task audit
