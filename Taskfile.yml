version: "3"

includes:
  tools:
    taskfile: ./Taskfile.tools.yml
    flatten: true

vars:
  BINARY: ele
  # A tool built by an older Go loads nothing under a newer one and reports no findings, so every gate checks this first.
  GO_VERSION:
    sh: go env GOVERSION
  # One slot for clone builds and install.sh releases, so whichever ran last is the ele every session's hooks call.
  INSTALL_DIR:
    sh: echo "${ELE_INSTALL_DIR:-$HOME/.local/bin}"
  REPOSITORY: nicolaspearson/claude-ephant
  TAP_FORMULA: nicolaspearson/tap/ele
  # Gates call pinned tools here, not whatever PATH finds first.
  TOOLS:
    sh: 'go env GOBIN | grep . || echo "$(go env GOPATH | cut -d: -f1)/bin"'

tasks:
  default:
    cmds:
      - task --list

  ##################################################
  # Aggregates
  ##################################################

  check:
    desc: "Run lint, docs lint, dead code, module tidiness and tests. audit needs the network, so it runs on its own."
    cmds:
      - task: lint
      - task: lint-docs
      - task: unused
      - task: tidy-check
      - task: test
  precommit:
    desc: "Format, then run check."
    cmds:
      - task: format
      - task: check
      - task: lint-fix
      - task: fix

  setup:
    desc: "Download modules and install the tooling."
    cmds:
      - go mod download
      - task: setup-tools

  ##################################################
  # Build and install
  ##################################################

  build:
    desc: "Build ele into dist/."
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - dist/{{.BINARY}}
    cmds:
      - go build -o dist/{{.BINARY}} ./cmd/ele

  clean:
    desc: "Remove build output and coverage."
    cmds:
      - rm -rf dist coverage.out

  dev:
    desc: "Install the clone's ele, then start Claude Code with the clone's plugin in place of the installed one, for that session only. Usage: task dev [-- <claude flags>]"
    interactive: true
    preconditions:
      - sh: command -v claude
        msg: "claude is not installed"
    cmds:
      - task: install
      - claude --plugin-dir ./plugin {{.CLI_ARGS}}

  install:
    desc: "Build ele from the clone into ELE_INSTALL_DIR (default ~/.local/bin), where release:script and upgrade install, and check PATH finds it. upgrade puts the release back."
    cmds:
      - mkdir -p "{{.INSTALL_DIR}}"
      - go build -o "{{.INSTALL_DIR}}/{{.BINARY}}" ./cmd/ele
      - task: release:check
        vars:
          DIR: "{{.INSTALL_DIR}}"

  install:local:
    desc: "Install the clone's ele, then update the plugin to the last commit pushed to main."
    preconditions:
      - sh: command -v claude
        msg: "claude is not installed; it updates the plugin"
    cmds:
      - task: install
      - claude plugin marketplace update claude-ephant
      - claude plugin update ele@claude-ephant
      - echo "Sessions already open load the updated plugin after /reload-plugins, or a restart."

  release:brew:
    desc: "Install or upgrade the latest release through Homebrew, then check it is the ele on PATH and prints the release's tag."
    preconditions:
      - sh: command -v brew
        msg: "brew is not installed"
      - sh: command -v gh
        msg: "gh is not installed; it reads the latest release's tag"
    cmds:
      - brew update
      - if brew list {{.TAP_FORMULA}} >/dev/null 2>&1; then brew upgrade {{.TAP_FORMULA}}; else brew install {{.TAP_FORMULA}}; fi
      - task: release:check
        vars:
          DIR:
            sh: echo "$(brew --prefix)/bin"
          TAG:
            sh: gh release view --repo {{.REPOSITORY}} --json tagName --jq .tagName

  # Fails while another copy is ahead on PATH, and lists every copy: the check is that this route's binary is the one run.
  release:check:
    internal: true
    requires:
      vars: [DIR]
    silent: true
    cmds:
      - |
        set -eu
        dir=$(cd "{{.DIR}}" && pwd -P)
        found=$(command -v {{.BINARY}} || true)
        if [ -z "$found" ] || [ "$(cd "$(dirname "$found")" && pwd -P)" != "$dir" ]; then
          echo "Installed $dir/{{.BINARY}}, but \`{{.BINARY}}\` resolves to ${found:-nothing}. Every copy on PATH, first wins:" >&2
          which -a {{.BINARY}} >&2 || true
          exit 1
        fi
        if ! installed=$({{.BINARY}} version 2>/dev/null); then
          echo "\`{{.BINARY}} version\` fails: most likely the build predates the command, else the binary does not run here" >&2
          exit 1
        fi
        tag="{{.TAG}}"
        if [ -n "$tag" ] && [ "$installed" != "$tag" ]; then
          echo "\`{{.BINARY}} version\` prints $installed; the latest release is $tag" >&2
          exit 1
        fi
        for copy in $(which -a {{.BINARY}}); do
          if [ "$(cd "$(dirname "$copy")" && pwd -P)" != "$dir" ]; then
            echo "Also on PATH, behind it: $copy"
          fi
        done
        echo "Installed $dir/{{.BINARY}}, $installed"

  release:go:
    desc: "Install the latest release with go install …@<tag> into Go's bin directory, then check it is the ele on PATH and prints the release's tag."
    preconditions:
      - sh: command -v gh
        msg: "gh is not installed; it reads the latest release's tag"
    vars:
      TAG:
        sh: gh release view --repo {{.REPOSITORY}} --json tagName --jq .tagName
    cmds:
      - go install github.com/{{.REPOSITORY}}/cmd/ele@{{.TAG}}
      - task: release:check
        vars:
          DIR: "{{.TOOLS}}"
          TAG: "{{.TAG}}"

  release:script:
    desc: "Install the latest release through install.sh into ELE_INSTALL_DIR (default ~/.local/bin), then check it is the ele on PATH and prints the release's tag."
    preconditions:
      - sh: command -v gh
        msg: "gh is not installed; it reads the latest release's tag"
    vars:
      TAG:
        sh: gh release view --repo {{.REPOSITORY}} --json tagName --jq .tagName
    cmds:
      - ELE_VERSION="{{.TAG}}" ELE_INSTALL_DIR="{{.INSTALL_DIR}}" sh ./install.sh
      - task: release:check
        vars:
          DIR: "{{.INSTALL_DIR}}"
          TAG: "{{.TAG}}"

  run:
    desc: "Run ele from source. Usage: task run -- recall pydantic"
    cmds:
      - go run ./cmd/ele {{.CLI_ARGS}}

  uninstall:
    desc: "Remove ele from ELE_INSTALL_DIR (default ~/.local/bin), the copy install and release:script write."
    cmds:
      - rm -f "{{.INSTALL_DIR}}/{{.BINARY}}"

  upgrade:
    desc: "Install the latest release through release:script, then update the plugin. ELE_INSTALL_DIR overrides ~/.local/bin."
    preconditions:
      - sh: command -v claude
        msg: "claude is not installed; it updates the plugin"
    cmds:
      - task: release:script
      - claude plugin marketplace update claude-ephant
      - claude plugin update ele@claude-ephant
      - echo "Sessions already open load the updated plugin after /reload-plugins, or a restart."
      - "{{.BINARY}} status"

  ##################################################
  # Gates
  ##################################################

  audit:
    desc: "Scan dependencies for vulnerabilities in code ele reaches."
    preconditions:
      - sh: test -x {{.TOOLS}}/govulncheck
        msg: "govulncheck is not installed — run: task setup-tools"
      - sh: '[ "$(go version {{.TOOLS}}/govulncheck | cut -d" " -f2)" = "{{.GO_VERSION}}" ]'
        msg: "govulncheck was built with a different Go than {{.GO_VERSION}} — run: task setup-tools"
    cmds:
      - "{{.TOOLS}}/govulncheck ./..."

  fix:
    desc: "Fix the go app"
    cmds:
      - go fix ./...

  format:
    desc: "Format Go source."
    cmds:
      - gofmt -w .

  lint:
    desc: "Check formatting, vet, catch shadowed variables, run staticcheck and shellcheck."
    preconditions:
      - sh: test -x {{.TOOLS}}/shadow
        msg: "shadow is not installed — run: task setup-tools"
      - sh: '[ "$(go version {{.TOOLS}}/shadow | cut -d" " -f2)" = "{{.GO_VERSION}}" ]'
        msg: "shadow was built with a different Go than {{.GO_VERSION}} — run: task setup-tools"
      - sh: command -v shellcheck
        msg: "shellcheck is not installed — brew install shellcheck, or your package manager's"
      - sh: test -x {{.TOOLS}}/staticcheck
        msg: "staticcheck is not installed — run: task setup-tools"
      - sh: '[ "$(go version {{.TOOLS}}/staticcheck | cut -d" " -f2)" = "{{.GO_VERSION}}" ]'
        msg: "staticcheck was built with a different Go than {{.GO_VERSION}} — run: task setup-tools"
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "$unformatted"
          echo "Not gofmt-clean; run: task format"
          exit 1
        fi
      - go vet ./...
      - go vet -vettool={{.TOOLS}}/shadow ./...
      # Package doc comments not required.
      - "{{.TOOLS}}/staticcheck -checks=all,-ST1000 -f stylish -fail=all ./..."
      - shellcheck install.sh

  lint-docs:
    desc: "Reject source line-number citations in .documentation."
    silent: true
    cmds:
      # A file:line citation is wrong on the next edit and reads as authoritative
      # while it is wrong. Cite a package and an identifier instead.
      - |
        if grep -rnE '\.(go|html):[0-9]+' .documentation/; then
          echo "Linting failed: cite a package and an identifier, never a source line number.";
          exit 1;
        fi

  lint-fix:
    desc: "Fix lint errors."
    cmds:
      - gofmt -s -w .

  test:
    desc: "Run the tests. Usage: task test [FORCE=1] to bypass the test cache."
    vars:
      FORCE: "{{if .FORCE}}-count=1{{end}}"
    cmds:
      - go test {{.FORCE}} -race ./...

  tidy-check:
    desc: "Fail when go.mod or go.sum is not tidy."
    cmds:
      - go mod tidy -diff

  unused:
    desc: "Catch parameters and functions nothing reads."
    preconditions:
      - sh: test -x {{.TOOLS}}/gopls
        msg: "gopls is not installed — run: task setup-tools"
      - sh: '[ "$(go version {{.TOOLS}}/gopls | cut -d" " -f2)" = "{{.GO_VERSION}}" ]'
        msg: "gopls was built with a different Go than {{.GO_VERSION}} — run: task setup-tools"
    cmds:
      - |
        if [ -z "$(find cmd internal -name '*.go' | head -1)" ]; then
          echo "No Go files under cmd/ or internal/."
          exit 1
        fi
        if ! report=$(find cmd internal -name '*.go' -print0 | xargs -0 {{.TOOLS}}/gopls check -severity=hint 2>&1); then
          echo "$report"
          echo "gopls failed, so dead code was not checked."
          exit 1
        fi
        dead=$(printf '%s\n' "$report" | grep -E 'unused parameter|is unused' || true)
        if [ -n "$dead" ]; then
          echo "$dead"
          echo "Dead code. Remove it, or name a parameter _ where an interface fixes its shape."
          exit 1
        fi

  ##################################################
  # Evals, run by hand
  ##################################################

  eval:
    desc: "Run the plugin's eval cases against the installed ele plugin, or a plugin path. Usage: task eval [-- ./plugin]. Each run costs model calls."
    preconditions:
      - sh: command -v claude
        msg: "claude is not installed"
    cmds:
      # --ablation none keeps Skill graders scored.
      - claude plugin eval {{.CLI_ARGS | default "ele@claude-ephant"}} --ablation none --allow-tools Bash --no-publish --scaffold --output-dir .task/eval --report .task/eval/report.html --trust-plugin
