name: Release
run-name: "Release ${{ github.ref_name }}"

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and publish
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
          cache: false
      # Pure Go (modernc.org/sqlite), so one runner cross-compiles every target.
      # No version in the names, so releases/latest/download/<name> stays a stable URL.
      - name: Build
        run: |
          mkdir dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            name="ele_${target%/*}_${target#*/}"
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -ldflags "-s -w" -o "dist/$name/ele" ./cmd/ele
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum ele_*.tar.gz > checksums.txt && cat checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ele_*.tar.gz dist/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
